services:
  - type: web
    name: aipcss-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aipcss-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

  - type: psql
    name: aipcss-db
    plan: free
