name: Deploy (Manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      reason:
        description: 'Deployment reason'
        required: true
        default: 'Manual deploy'

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'production'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install gunicorn

      - name: Run pre-deploy checks
        run: |
          cd backend
          python -c "from app import create_app; app = create_app(); print('App created successfully')"

      - name: Deploy notification
        run: |
          echo "Backend deployment triggered for ${{ github.event.inputs.environment }}"
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "Deploy step should be configured with your hosting provider"
          echo "Common options: AWS, GCP, Azure, Railway, Render, Fly.io"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'production'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build for production
        run: |
          cd frontend
          npm run build

      - name: Deploy notification
        run: |
          echo "Frontend deployment triggered for ${{ github.event.inputs.environment }}"
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "Deploy step should be configured with your hosting provider"
          echo "Common options: Vercel, Netlify, AWS S3 + CloudFront"
