name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-and-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install flake8 black pytest pytest-cov
          pip install -r requirements.txt

      - name: Lint with flake8 (informational)
        run: |
          cd backend
          flake8 app/ run.py --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics --show-source
        continue-on-error: true

      - name: Check formatting with black (informational)
        run: |
          cd backend
          black --check --line-length=120 app/ run.py || true
        continue-on-error: true

      - name: Verify app can be imported
        run: |
          cd backend
          python -c "from app import create_app; app = create_app(); print('App created successfully')"

      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -v --cov=app --cov-report=term-missing --tb=short || echo "No tests found yet - skipping"
        continue-on-error: true

      - name: Security check with bandit
        run: |
          pip install bandit
          cd backend
          bandit -r app/ -ll || true
        continue-on-error: true
