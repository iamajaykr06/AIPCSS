name: AIPCSS Bot Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read
  checks: read

jobs:
  review:
    name: Automated PR Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend lint tools
        run: pip install flake8 bandit requests

      - name: Install frontend lint tools
        working-directory: frontend
        run: npm ci

      # -- Backend Checks --

      - name: Run Flake8
        id: flake8
        run: |
          echo "## Flake8 Lint Report" > flake8_report.md
          PY_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^backend/.*\.py$' || true)
          if [ -n "$PY_FILES" ]; then
            set +e
            flake8 $PY_FILES --max-line-length=120 > result.txt 2>&1
            EXIT_CODE=$?
            set -e
            if [ $EXIT_CODE -ne 0 ]; then
              echo "flake8_failed=true" >> $GITHUB_OUTPUT
              echo "\`\`\`" >> flake8_report.md
              cat result.txt >> flake8_report.md
              echo "\`\`\`" >> flake8_report.md
            else
              echo "Passed: All Python files pass linting." >> flake8_report.md
            fi
          else
            echo "No Python files changed." >> flake8_report.md
          fi

      - name: Run Bandit (Security)
        id: bandit
        run: |
          echo "## Security Scan Report" > bandit_report.md
          PY_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^backend/.*\.py$' || true)
          if [ -n "$PY_FILES" ]; then
            set +e
            bandit $PY_FILES -f txt > result.txt 2>&1
            EXIT_CODE=$?
            set -e
            if [ $EXIT_CODE -ne 0 ]; then
              echo "bandit_failed=true" >> $GITHUB_OUTPUT
              echo "\`\`\`" >> bandit_report.md
              cat result.txt >> bandit_report.md
              echo "\`\`\`" >> bandit_report.md
            else
              echo "Passed: No security issues found." >> bandit_report.md
            fi
          else
            echo "No Python files changed." >> bandit_report.md
          fi

      # -- Frontend Checks --

      - name: Run ESLint
        id: eslint
        run: |
          echo "## ESLint Report" > eslint_report.md
          TS_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^frontend/src/.*\.\(ts\|tsx\)$' || true)
          if [ -n "$TS_FILES" ]; then
            set +e
            npx eslint $TS_FILES > result.txt 2>&1
            EXIT_CODE=$?
            set -e
            if [ $EXIT_CODE -ne 0 ]; then
              echo "eslint_failed=true" >> $GITHUB_OUTPUT
              echo "\`\`\`" >> eslint_report.md
              cat result.txt >> eslint_report.md
              echo "\`\`\`" >> eslint_report.md
            else
              echo "Passed: All TypeScript files pass ESLint." >> eslint_report.md
            fi
          else
            echo "No TypeScript files changed." >> eslint_report.md
          fi

      - name: Run TypeScript check
        id: tsc
        run: |
          echo "## TypeScript Check Report" > tsc_report.md
          TS_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^frontend/src/.*\.\(ts\|tsx\)$' || true)
          if [ -n "$TS_FILES" ]; then
            set +e
            cd frontend && npx tsc --noEmit > ../result.txt 2>&1
            EXIT_CODE=$?
            cd ..
            set -e
            if [ $EXIT_CODE -ne 0 ]; then
              echo "tsc_failed=true" >> $GITHUB_OUTPUT
              echo "\`\`\`" >> tsc_report.md
              cat result.txt >> tsc_report.md
              echo "\`\`\`" >> tsc_report.md
            else
              echo "Passed: TypeScript compilation successful." >> tsc_report.md
            fi
          else
            echo "No TypeScript files changed." >> tsc_report.md
          fi

      # -- AI Logic Review --

      - name: Gemini AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "## AI Logic Review" > ai_report.md
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Warning: AI Review skipped (Secret missing)." >> ai_report.md
          else
            DIFF=$(git diff origin/${{ github.base_ref }}...HEAD | head -c 15000)
            CLEAN_DIFF=$(echo "$DIFF" | jq -aRs .)
            RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"contents\": [{\"parts\":[{\"text\": \"Review this git diff for logic errors and performance. Respond in Markdown.\n\n$CLEAN_DIFF\"}]}]}")
            echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' >> ai_report.md
          fi

      # -- Final Report Assembly --

      - name: Generate review body
        id: review_body
        run: |
          echo "## AIPCSS Bot Reviewer Report" > review.md
          echo "" >> review.md
          
          if [ "${{ steps.flake8.outputs.flake8_failed }}" == "true" ] || \
             [ "${{ steps.eslint.outputs.eslint_failed }}" == "true" ] || \
             [ "${{ steps.tsc.outputs.tsc_failed }}" == "true" ] || \
             [ "${{ steps.bandit.outputs.bandit_failed }}" == "true" ]; then
            echo "### Status: Issues Found - Action Required" >> review.md
          else
            echo "### Status: All Quality Checks Passed" >> review.md
          fi

          echo "---" >> review.md
          cat ai_report.md >> review.md
          echo "---" >> review.md
          cat flake8_report.md >> review.md
          echo "---" >> review.md
          cat bandit_report.md >> review.md
          echo "---" >> review.md
          cat eslint_report.md >> review.md
          echo "---" >> review.md
          cat tsc_report.md >> review.md

      - name: Post PR review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.body.includes('AIPCSS Bot Reviewer Report'));
            if (botComment) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: botComment.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
